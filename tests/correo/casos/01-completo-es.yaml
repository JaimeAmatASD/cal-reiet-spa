descripcion: Clienta alojada que manda los cuatro datos de una vez.

hilo:
  id: hilo-001
  asunto: Masaje
  mensajes:
    - de: marta.vidal@ejemplo.com
      nombre: Marta Vidal
      texto: |
        Buenas tardes,

        Estamos alojados en la habitación 9 y nos gustaría reservar un masaje
        de 60 minutos para dos personas el 12 de septiembre por la tarde.

        Muchas gracias,
        Marta Vidal

lectura:
  idioma: es
  intencion: reserva
  senales_salud: false
  pide_recomendacion: false
  cliente:
    nombre: {valor: Marta Vidal, origen: dicho}
    correo: {valor: marta.vidal@ejemplo.com, origen: dicho}
    habitacion: {valor: "9", origen: dicho}
  peticion:
    duracion: {valor: 60, origen: dicho}
    fecha: {valor: "2026-09-12", origen: dicho}
    franja: {valor: tarde, origen: dicho}
    personas: {valor: 2, origen: dicho}

espera:
  salida: completo
  falta: []
  a_confirmar: []
  idioma: es
  borrador_contiene:
    - "Hola Marta Vidal,"
    - Lo tenemos todo para buscarte hueco.
    - "[COMPLETAR A MANO: huecos libres del 12 de septiembre]"
    - Equipo de Wellbeing - Cal Reiet
  # Al cliente nunca se le escribe una fecha como la escribe una máquina.
  borrador_no_contiene:
    - "2026-09-12"
