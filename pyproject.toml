[project]
name = "cal-reiet-spa"
version = "0.1.0"
description = "Gestor de reservas del spa de Cal Reiet"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Sin esto los tests no encuentran el código de src/.
pythonpath = ["src"]
testpaths = ["tests"]
